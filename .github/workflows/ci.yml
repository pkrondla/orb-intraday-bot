name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Types (mypy strict)
        run: mypy src

      - name: Architecture rules (import-linter)
        run: lint-imports

      - name: Tests with coverage gate
        run: pytest -q --cov --cov-report=term-missing

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock --disable-pip --no-deps
