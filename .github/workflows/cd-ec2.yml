name: CD - Deploy ORB bot to Windows EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    # The secrets and variables live in the "prod" environment, so the job must name it.
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Secrets: WINRM_PASSWORD, GH_PAT, GROWW_TOTP_TOKEN, GROWW_TOTP_SECRET,
      #          TELEGRAM_BOT_TOKEN
      # Variables: WINRM_HOST, WINRM_USERNAME, TELEGRAM_CHAT_ID, LIVE_MODE (optional),
      #            LIVE_ARMED, DRY_RUN (default true), HEALTHCHECK_URL (optional),
      #            CAPITAL_INR, RISK_PER_TRADE_PCT, DAILY_LOSS_LIMIT_PCT, MAX_LOTS_PER_TRADE
      #            (all optional: unset keeps the value in config/*.yaml)
      #
      # One-time EC2 prerequisites (already true if GrowwBot is deployed):
      # - WinRM HTTPS on 5986, Python 3.12, Git, nssm on PATH

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require CI green on this sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Deploying sha=$sha"
          # Best-effort: list recent successful CI runs for this sha. Do not hard-fail
          # on a brand-new repo where the check name differs; the install script still
          # runs orb-bot check as a smoke test.
          if gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}&status=completed&per_page=20" \
            --jq '.workflow_runs[] | select(.name=="CI" and .conclusion=="success") | .id' \
            | head -n1 | grep -q .; then
            echo "CI success found for $sha"
          else
            echo "WARNING: no successful CI run found for $sha yet; continuing (smoke test will run on the host)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WinRM client
        run: python -m pip install --upgrade pip pywinrm

      - name: Deploy over WinRM (HTTPS 5986)
        env:
          WINRM_HOST: ${{ vars.WINRM_HOST || secrets.WINRM_HOST }}
          WINRM_USERNAME: ${{ vars.WINRM_USERNAME || secrets.WINRM_USERNAME }}
          WINRM_PASSWORD: ${{ secrets.WINRM_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_REF: main
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || '' }}
          LIVE_MODE: ${{ vars.LIVE_MODE || 'paper' }}
          LIVE_ARMED: ${{ vars.LIVE_ARMED || 'false' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          CAPITAL_INR: ${{ vars.CAPITAL_INR || '' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '' }}
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT || '' }}
          MAX_LOTS_PER_TRADE: ${{ vars.MAX_LOTS_PER_TRADE || '' }}
        run: |
          python - <<'PY'
          import os, sys, base64, time, winrm
          from requests.exceptions import ConnectionError as WinRMDropped

          required = [
              "WINRM_HOST", "WINRM_USERNAME", "WINRM_PASSWORD", "GH_PAT",
              "GROWW_TOTP_TOKEN", "GROWW_TOTP_SECRET",
          ]
          missing = [n for n in required if not os.environ.get(n, "").strip()]
          if missing:
              raise SystemExit(
                  "Missing GitHub settings (Settings > Secrets and variables > Actions, as a "
                  "repository variable or secret): " + ", ".join(missing)
              )

          host = os.environ["WINRM_HOST"]
          username = os.environ["WINRM_USERNAME"]
          password = os.environ["WINRM_PASSWORD"]
          endpoint = f"https://{host}:5986/wsman"
          # Same defaults as telegram-groww-ai-bot. A 10-minute client timeout made the
          # Windows WinRM service close the socket (RemoteDisconnected) on long scripts.
          def connect() -> winrm.Session:
              return winrm.Session(
                  endpoint, auth=(username, password), transport="basic",
                  server_cert_validation="ignore",
              )

          session = connect()

          def clean(name: str) -> str:
              return str(os.environ.get(name, "")).replace("\r", "").replace("\n", "").strip()

          def run_ps(script: str, name: str) -> None:
              global session
              last: Exception | None = None
              for attempt in range(1, 4):
                  try:
                      r = session.run_ps(script)
                      out = r.std_out.decode("utf-8", errors="replace")
                      err = r.std_err.decode("utf-8", errors="replace")
                      if out:
                          sys.stdout.write(out)
                      if err:
                          sys.stderr.write(err)
                      if r.status_code != 0:
                          raise SystemExit(f"{name} failed with status_code={r.status_code}")
                      return
                  except WinRMDropped as exc:
                      last = exc
                      sys.stderr.write(f"{name}: WinRM dropped ({exc}); retry {attempt}/3\n")
                      time.sleep(5)
                      session = connect()
              raise SystemExit(f"{name} failed after retries: {last}")

          env_lines = [
              f"GROWW_TOTP_TOKEN={clean('GROWW_TOTP_TOKEN')}",
              f"GROWW_TOTP_SECRET={clean('GROWW_TOTP_SECRET')}",
              "DATA_DIR=data",
              f"TELEGRAM_BOT_TOKEN={clean('TELEGRAM_BOT_TOKEN')}",
              f"TELEGRAM_CHAT_ID={clean('TELEGRAM_CHAT_ID')}",
              f"HEALTHCHECK_URL={clean('HEALTHCHECK_URL')}",
              f"LIVE_MODE={clean('LIVE_MODE')}",
              f"LIVE_ARMED={clean('LIVE_ARMED')}",
              f"DRY_RUN={clean('DRY_RUN')}",
              f"CAPITAL_INR={clean('CAPITAL_INR')}",
              f"RISK_PER_TRADE_PCT={clean('RISK_PER_TRADE_PCT')}",
              f"DAILY_LOSS_LIMIT_PCT={clean('DAILY_LOSS_LIMIT_PCT')}",
              f"MAX_LOTS_PER_TRADE={clean('MAX_LOTS_PER_TRADE')}",
          ]
          clone_url = (
              f"https://x-access-token:{clean('GH_PAT')}@github.com/"
              f"{clean('GITHUB_REPOSITORY')}.git"
          )
          git_ref = clean("GIT_REF") or "main"

          run_ps(
              f"""
              $ErrorActionPreference = "Stop"
              $env:GCM_CREDENTIAL_STORE = "none"
              $env:GCM_INTERACTIVE = "never"
              $env:GIT_TERMINAL_PROMPT = "0"
              $env:GIT_PAGER = "cat"
              $env:PAGER = "cat"
              function Invoke-Native([scriptblock]$Command, [string]$Label) {{
                Write-Host $Label
                & $Command
                if ($LASTEXITCODE -ne 0) {{ throw "$Label failed with exit code $LASTEXITCODE" }}
              }}
              $repo = "C:\\orb-bot"
              $dataDir = Join-Path $repo "data"
              $backupDataDir = "C:\\orb-bot-data-backup"
              if (-not (Get-Command nssm -ErrorAction SilentlyContinue)) {{
                throw "nssm was not found on PATH."
              }}
              if (Test-Path (Join-Path $repo ".git")) {{
                Invoke-Native {{ git -c core.pager=cat -C $repo fetch origin }} "git fetch"
                Invoke-Native {{ git -c core.pager=cat -C $repo reset --hard "origin/{git_ref}" }} "git reset"
              }} else {{
                if (Test-Path $repo) {{
                  if (Test-Path $dataDir) {{
                    if (Test-Path $backupDataDir) {{ Remove-Item -Recurse -Force $backupDataDir }}
                    Move-Item -Path $dataDir -Destination $backupDataDir
                  }}
                  Remove-Item -Recurse -Force $repo
                }}
                Invoke-Native {{ git -c core.pager=cat clone "{clone_url}" $repo }} "git clone"
                if (Test-Path $backupDataDir) {{
                  New-Item -ItemType Directory -Path $repo -Force | Out-Null
                  Move-Item -Path $backupDataDir -Destination $dataDir
                }}
              }}
              Write-Host "Host repo HEAD is $((git -c core.pager=cat -C $repo rev-parse HEAD).Trim())"
              New-Item -ItemType Directory -Path (Join-Path $repo "logs") -Force | Out-Null
              New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
              """,
              "prep/clone",
          )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $repo = "C:\\orb-bot"
              $envPath = Join-Path $repo ".env"
              $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText($envPath, "", $utf8NoBom)
              """,
              "init env",
          )
          token = clean("TELEGRAM_BOT_TOKEN")
          bot_id = token.split(":", 1)[0] if token else "(empty)"
          print(
              f"Host Telegram bot id (token prefix): {bot_id}; "
              f"TELEGRAM_CHAT_ID={clean('TELEGRAM_CHAT_ID') or '(empty)'}"
          )

          for i, line in enumerate(env_lines, start=1):
              line_b64 = base64.b64encode((line + "\n").encode("utf-8")).decode("ascii")
              run_ps(
                  f"""
                  $ErrorActionPreference = "Stop"
                  $repo = "C:\\orb-bot"
                  $envPath = Join-Path $repo ".env"
                  $line = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("{line_b64}"))
                  $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
                  [System.IO.File]::AppendAllText($envPath, $line, $utf8NoBom)
                  """,
                  f"write env line {i}",
              )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $path = "C:\\orb-bot\\scripts\\deploy\\Install-OrbBot.ps1"
              $text = Get-Content -LiteralPath $path -Raw
              if ($text.IndexOf('[string]$Label)') -lt 0) {
                throw 'Host install script is still the broken Invoke-Native $Name version after git reset.'
              }
              Write-Host "Host install script has the Label fix"
              """,
              "verify install script",
          )

          # Short WinRM calls, same shape as telegram-groww-ai-bot. One long
          # Install-OrbBot.ps1 run is what closed the connection.
          run_ps(
              """
              $ErrorActionPreference = "Stop"
              function Invoke-Native([scriptblock]$Command, [string]$Label) {
                Write-Host $Label
                & $Command
                if ($LASTEXITCODE -ne 0) { throw "$Label failed with exit code $LASTEXITCODE" }
              }
              $repo = "C:\\orb-bot"
              $venv = Join-Path $repo ".venv\\Scripts\\python.exe"
              $py = @(
                "C:\\Program Files\\Python312\\python.exe",
                "C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python312\\python.exe",
                "C:\\Python312\\python.exe"
              ) | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $py) { $py = (Get-Command python).Source }
              if (-not (Test-Path $venv)) {
                Invoke-Native { & $py -m venv (Join-Path $repo ".venv") } "create venv"
              }
              Invoke-Native { & $venv -m pip install --upgrade pip } "pip upgrade"
              Invoke-Native { & $venv -m pip install --no-deps -r (Join-Path $repo "requirements.lock") } "pip install lock"
              Invoke-Native { & $venv -m pip install --no-deps -e $repo } "pip install package"
              Write-Host "pip done"
              """,
              "pip",
          )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $repo = "C:\\orb-bot"
              $venv = Join-Path $repo ".venv\\Scripts\\python.exe"
              foreach ($pair in @(
                @("start-orb-bot.ps1", "serve"),
                @("start-orb-watch.ps1", "watchdog")
              )) {
                $path = Join-Path $repo $pair[0]
                @(
                  '$ErrorActionPreference = "Stop"'
                  "`$repo = `"$repo`""
                  'Get-Content (Join-Path $repo ".env") -ErrorAction SilentlyContinue | ForEach-Object {'
                  '  if ($_ -match "^\\s*#" -or [string]::IsNullOrWhiteSpace($_)) { return }'
                  '  $parts = $_.Split("=", 2)'
                  '  if ($parts.Count -eq 2) { [System.Environment]::SetEnvironmentVariable($parts[0], $parts[1], "Process") }'
                  '}'
                  "Set-Location `$repo"
                  "& `"$venv`" -m orb_intraday_bot $($pair[1])"
                ) | Set-Content -Path $path -Encoding utf8
              }
              Write-Host "launchers written"
              """,
              "launchers",
          )

          service_script = r"""
              $ErrorActionPreference = "Stop"
              function Invoke-Native([scriptblock]$Command, [string]$Label) {
                Write-Host $Label
                & $Command
                if ($LASTEXITCODE -ne 0) { throw "$Label failed with exit code $LASTEXITCODE" }
              }
              function Install-NssmService {
                param([string]$ServiceName, [string]$Launcher, [string]$Stdout, [string]$Stderr)
                $repo = "C:\orb-bot"
                if (Get-Service -Name $ServiceName -ErrorAction SilentlyContinue) {
                  Invoke-Native { nssm stop $ServiceName confirm } "nssm stop $ServiceName" | Out-Null
                  Start-Sleep -Seconds 2
                  Invoke-Native { nssm remove $ServiceName confirm } "nssm remove $ServiceName" | Out-Null
                }
                Invoke-Native { nssm install $ServiceName "powershell.exe" } "nssm install $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppParameters "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$Launcher`"" } "nssm set AppParameters $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppDirectory $repo } "nssm set AppDirectory $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppStdout $Stdout } "nssm set AppStdout $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppStderr $Stderr } "nssm set AppStderr $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppRotateFiles 1 } "nssm set AppRotateFiles $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppRotateOnline 1 } "nssm set AppRotateOnline $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName Start SERVICE_AUTO_START } "nssm set Start $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppExit Default Restart } "nssm set AppExit $ServiceName" | Out-Null
                Invoke-Native { nssm set $ServiceName AppThrottle 15000 } "nssm set AppThrottle $ServiceName" | Out-Null
                Invoke-Native { nssm start $ServiceName } "nssm start $ServiceName" | Out-Null
                Start-Sleep -Seconds 3
                $status = (nssm status $ServiceName).Trim()
                if ($status -ne "SERVICE_RUNNING") { throw "Service $ServiceName failed to start: $status" }
                Write-Host "$ServiceName is running."
              }
              $repo = "C:\orb-bot"
              $logs = Join-Path $repo "logs"
              Install-NssmService -ServiceName "OrbBot" -Launcher (Join-Path $repo "start-orb-bot.ps1") `
                -Stdout (Join-Path $logs "orb-bot.log") -Stderr (Join-Path $logs "orb-bot-error.log")
              Install-NssmService -ServiceName "OrbBotWatch" -Launcher (Join-Path $repo "start-orb-watch.ps1") `
                -Stdout (Join-Path $logs "orb-watch.log") -Stderr (Join-Path $logs "orb-watch-error.log")
              """
          run_ps(service_script, "nssm")

          run_ps(
              """
              $ErrorActionPreference = "Continue"
              $venv = "C:\\orb-bot\\.venv\\Scripts\\python.exe"
              & $venv -m orb_intraday_bot check
              if ($LASTEXITCODE -ne 0) {
                Write-Host "WARNING: orb-bot check failed (Groww login/permissions). Services are running; fix GROWW_TOTP_* and the bot will pick it up on the next session or after nssm restart OrbBot."
              } else {
                Write-Host "Deploy complete."
              }
              """,
              "check",
          )
          PY
