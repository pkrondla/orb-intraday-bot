[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-intraday-bot"
version = "0.10.0"
description = "ORB Intraday Bot - Nifty futures paper/shadow/live bot (live disarmed by default)"
requires-python = ">=3.12"
dependencies = [
    "growwapi>=1.5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyotp>=2.9",
    "pyyaml>=6.0",
    "tzdata",
]

[project.scripts]
orb-bot = "orb_intraday_bot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/orb_intraday_bot"]
branch = true
omit = [
    "src/orb_intraday_bot/__main__.py",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_package = "orb_intraday_bot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: each layer only imports from layers below it"
type = "layers"
layers = [
    "orb_intraday_bot.cli",
    "orb_intraday_bot.app",
    "orb_intraday_bot.analysis",
    "orb_intraday_bot.runtime",
    "orb_intraday_bot.storage",
    "orb_intraday_bot.paper | orb_intraday_bot.execution",
    "orb_intraday_bot.options",
    "orb_intraday_bot.engine",
    "orb_intraday_bot.patterns | orb_intraday_bot.risk",
    "orb_intraday_bot.indicators",
    "orb_intraday_bot.core",
]

[[tool.importlinter.contracts]]
name = "Strategy core never touches brokers, storage, runtime or I/O libraries"
type = "forbidden"
source_modules = [
    "orb_intraday_bot.core",
    "orb_intraday_bot.indicators",
    "orb_intraday_bot.patterns",
    "orb_intraday_bot.risk",
    "orb_intraday_bot.engine",
]
forbidden_modules = [
    "orb_intraday_bot.adapters",
    "orb_intraday_bot.storage",
    "orb_intraday_bot.execution",
    "orb_intraday_bot.runtime",
    "orb_intraday_bot.analysis",
    "orb_intraday_bot.app",
    "orb_intraday_bot.cli",
    "growwapi",
    "sqlite3",
    "requests",
    "urllib",
]

[[tool.importlinter.contracts]]
name = "Broker adapters do not import strategy, paper or runtime code"
type = "forbidden"
source_modules = ["orb_intraday_bot.adapters"]
forbidden_modules = [
    "orb_intraday_bot.patterns",
    "orb_intraday_bot.engine",
    "orb_intraday_bot.risk",
    "orb_intraday_bot.paper",
    "orb_intraday_bot.storage",
    "orb_intraday_bot.runtime",
    "orb_intraday_bot.analysis",
    "orb_intraday_bot.app",
    "orb_intraday_bot.cli",
]

[[tool.importlinter.contracts]]
name = "Only the Groww adapter may import the Groww SDK"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "orb_intraday_bot.core",
    "orb_intraday_bot.data",
    "orb_intraday_bot.indicators",
    "orb_intraday_bot.patterns",
    "orb_intraday_bot.risk",
    "orb_intraday_bot.engine",
    "orb_intraday_bot.options",
    "orb_intraday_bot.paper",
    "orb_intraday_bot.storage",
    "orb_intraday_bot.runtime",
    "orb_intraday_bot.analysis",
    "orb_intraday_bot.app",
    "orb_intraday_bot.cli",
]
forbidden_modules = ["growwapi"]
